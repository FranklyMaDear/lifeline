<head>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0d0d0d; color: #fff; margin: 0; padding: 20px; text-align: center; }
        h1 { color: #FFD700; text-shadow: 0 0 20px rgba(255,215,0,0.3); }
        #container { max-width: 700px; margin: 0 auto; }
        
        #camera-wrapper { position: relative; width: 100%; max-width: 500px; margin: 20px auto; border-radius: 20px; overflow: hidden; border: 3px solid #FFD700; box-shadow: 0 0 30px rgba(255,215,0,0.2); background: #111; }
        video { width: 100%; display: block; transform: scaleX(-1); }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); pointer-events: none; }

        .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 20px 0; }
        .btn { padding: 12px 24px; border: none; border-radius: 30px; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.3s; flex: 1; min-width: 80px; }
        .btn-gold { background: #FFD700; color: #111; }
        .btn-gold:hover { background: #FFC107; transform: scale(1.03); }
        .btn-green { background: #2ecc71; color: #fff; }
        .btn-red { background: #e74c3c; color: #fff; }
        .btn-blue { background: #3498db; color: #fff; }
        .btn-purple { background: #9b59b6; color: #fff; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        #user-inputs-row { display: flex; justify-content: center; align-items: center; gap: 15px; margin: 10px 0; flex-wrap: wrap; width: 100%; }
        .input-group { display: flex; align-items: center; gap: 8px; background: #1a1a1a; padding: 10px 16px; border-radius: 25px; border: 1px solid #444; flex: 0 1 auto; min-width: 140px; }
        .input-group label { color: #aaa; font-size: 14px; }
        select, input { padding: 6px 12px; border-radius: 20px; border: none; background: #333; color: white; font-size: 14px; height: 36px; }
        input[type="number"] { width: 60px; }

        #gender-selector { display: flex; justify-content: center; gap: 15px; margin: 10px 0; flex-wrap: wrap; }
        .gender-btn { padding: 10px 24px; border: 2px solid #444; border-radius: 30px; background: transparent; color: #aaa; cursor: pointer; transition: 0.3s; font-size: 16px; }
        .gender-btn.active { border-color: #FFD700; color: #FFD700; background: rgba(255,215,0,0.1); }

        #result-area { display: none; background: #1a1a1a; border-radius: 20px; padding: 20px; margin-top: 20px; border-left: 5px solid #FFD700; text-align: left; }
        #result-area h2 { color: #FFD700; margin-top: 0; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .stat-item { background: #222; padding: 8px 12px; border-radius: 10px; }

        .badge { display: inline-block; background: #FFD700; color: #111; padding: 2px 10px; border-radius: 20px; font-size: 12px; }
        #loading { display: none; margin: 15px; color: #aaa; }

        #upload-section { margin: 20px 0; padding: 25px; border: 2px dashed #444; border-radius: 20px; background: #1a1a1a; }
        #upload-section:hover { border-color: #FFD700; }
        #file-input { display: none; }
        .upload-label { padding: 15px 30px; background: #333; border-radius: 30px; cursor: pointer; display: inline-block; transition: 0.3s; font-size: 16px; }
        .upload-label:hover { background: #444; }
        #upload-preview { max-width: 100%; max-height: 300px; border-radius: 10px; margin: 10px 0; display: none; }
        #auto-status { margin: 10px 0; color: #2ecc71; font-weight: bold; display: none; }
        #upload-type { margin: 10px 0; color: #FFD700; font-weight: bold; font-size: 16px; }

        #age-display { margin: 15px 0; color: #FFD700; font-size: 18px; }
        #element-display { margin: 10px 0; color: #aaa; font-size: 16px; }

        #history-area { display: none; margin-top: 30px; text-align: left; }
        #history-area h2 { color: #FFD700; }
        .history-item { background: #1a1a1a; padding: 15px; border-radius: 10px; margin: 10px 0; border-left: 4px solid #3498db; }
        .history-actions { display: flex; gap: 5px; margin-top: 5px; }
        .history-actions button { padding: 5px 12px; border: none; border-radius: 15px; cursor: pointer; font-size: 12px; }

        .instructions {
            margin-top: 10px;
            padding: 12px;
            background: #1a1a1a;
            border-radius: 10px;
            border: 1px solid #FFD700;
            color: #eee;
            font-size: 14px;
        }
        .instructions strong { color: #FFD700; }

        @media (max-width: 480px) {
            #user-inputs-row { gap: 10px; }
            .input-group { padding: 6px 12px; min-width: 100px; }
            select, input { font-size: 13px; padding: 4px 8px; height: 32px; }
            input[type="number"] { width: 50px; }
            #gender-selector { gap: 10px; }
            .gender-btn { padding: 8px 16px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <div id="container">
        <h1>🧿 HandMaster Pro</h1>
        <p style="color:#aaa;">Προηγμένη Ανάλυση Χειρομαντείας</p>

        <div id="user-inputs-row">
            <div class="input-group">
                <label>🎂</label>
                <input type="number" id="user-age" min="1" max="120" value="30">
            </div>
            <div class="input-group">
                <label>♈</label>
                <select id="zodiac">
                    <option value="Κριός">Κριός</option>
                    <option value="Ταύρος">Ταύρος</option>
                    <option value="Δίδυμοι">Δίδυμοι</option>
                    <option value="Καρκίνος">Καρκίνος</option>
                    <option value="Λέων">Λέων</option>
                    <option value="Παρθένος">Παρθένος</option>
                    <option value="Ζυγός">Ζυγός</option>
                    <option value="Σκορπιός">Σκορπιός</option>
                    <option value="Τοξότης">Τοξότης</option>
                    <option value="Αιγόκερως">Αιγόκερως</option>
                    <option value="Υδροχόος">Υδροχόος</option>
                    <option value="Ιχθείς">Ιχθείς</option>
                </select>
            </div>
        </div>

        <div id="gender-selector">
            <button class="gender-btn active" id="maleBtn" onclick="setGender('male')">♂ Άντρας</button>
            <button class="gender-btn" id="femaleBtn" onclick="setGender('female')">♀ Γυναίκα</button>
        </div>

        <div id="upload-section">
            <label for="file-input" class="upload-label">📁 Ανέβασε φωτογραφία</label>
            <input type="file" id="file-input" accept="image/*" onchange="handleUpload(event)">
            <div id="upload-type"></div>
            <img id="upload-preview">
            <div id="auto-status" style="margin-top:10px; color:#2ecc71; font-weight:bold; display:none;">⏳ Αυτόματη ανάλυση σε εξέλιξη...</div>
            <div class="instructions">
                <strong>📌 Οδηγίες:</strong> Πατήστε το κουμπί <strong>Κάμερα</strong> και τοποθετήστε το χέρι μπροστά στην Οθόνη. 
                Η ανάλυση θα γίνει <strong>αυτόματα!</strong> ή ανεβάστε φωτογραφία.
            </div>
        </div>

        <div id="camera-wrapper">
            <video id="webcam" playsinline></video>
            <canvas id="overlay"></canvas>
        </div>

        <div class="controls">
            <button class="btn btn-gold" id="startBtn" onclick="startCamera()">📷 Κάμερα</button>
            <button class="btn btn-red" id="refreshBtn" onclick="refreshWithAd()">🔄 Ανανέωση</button>
        </div>

        <div id="loading">⏳ Αναλύω...</div>

        <div id="result-area">
            <h2>🔮 Ανάλυση</h2>
            <div id="element-display"></div>
            <div id="age-display"></div>
            <div id="result-text"></div>
            <div class="stat-grid" id="stats-grid"></div>
            <div style="display:flex; gap:10px; margin-top:20px; flex-wrap:wrap;">
                <button class="btn btn-blue" onclick="exportPDF()">📄 PDF</button>
                <button class="btn btn-purple" onclick="saveToHistory()">💾 Αποθήκευση</button>
            </div>
        </div>

        <div id="history-area">
            <h2>📚 Ιστορικό Αναλύσεων</h2>
            <div id="history-list"></div>
            <button class="btn btn-red" onclick="clearHistory()">🗑️ Διαγραφή Ιστορικού</button>
        </div>
    </div>

    <script>
        // --- MediaPipe Setup ---
        const video = document.getElementById('webcam');
        const overlay = document.getElementById('overlay');
        const ctx = overlay.getContext('2d');
        let landmarksData = null;
        let analysisResult = null;
        let capturedPhoto = null;
        let uploadedImage = null;
        let analysisDone = false;
        let userGender = 'male';
        let detectedHand = null;
        let camera = null;

        overlay.width = 500; overlay.height = 500;

        const hands = new Hands({
            locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.5
        });

        hands.onResults((results) => {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                landmarksData = results.multiHandLandmarks[0];
                drawHand(landmarksData);
                document.getElementById('startBtn').disabled = true;
                
                const wristX = landmarksData[0].x;
                detectedHand = wristX > 0.5 ? 'right' : 'left';
                
                if (!analysisDone) {
                    analysisDone = true;
                    performAnalysis();
                }
            } else {
                ctx.clearRect(0, 0, overlay.width, overlay.height);
                landmarksData = null;
                analysisDone = false;
                detectedHand = null;
            }
        });

        function drawHand(lm) {
            ctx.clearRect(0, 0, overlay.width, overlay.height);
            ctx.save();
            ctx.scale(1,1);
            drawConnectors(ctx, lm, HAND_CONNECTIONS, {color:'#FFD700', lineWidth:2});
            drawLandmarks(ctx, lm, {color:'#FFD700', radius:4});
            ctx.restore();
        }

        function setGender(gender) {
            userGender = gender;
            document.querySelectorAll('.gender-btn').forEach(b => b.classList.remove('active'));
            if (gender === 'male') {
                document.getElementById('maleBtn').classList.add('active');
            } else {
                document.getElementById('femaleBtn').classList.add('active');
            }
        }

        function handleUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                uploadedImage = e.target.result;
                const preview = document.getElementById('upload-preview');
                preview.src = uploadedImage;
                preview.style.display = 'block';
                
                document.getElementById('auto-status').style.display = 'block';
                document.getElementById('auto-status').innerText = '⏳ Αυτόματη ανάλυση σε εξέλιξη...';
                
                setTimeout(() => {
                    const result = analyzeHand();
                    displayResult(result);
                    analysisResult = result;
                    document.getElementById('auto-status').innerText = '✅ Ανάλυση ολοκληρώθηκε!';
                    document.getElementById('auto-status').style.color = '#2ecc71';
                }, 500);
            };
            reader.readAsDataURL(file);
        }

        function startCamera() {
            const btn = document.getElementById('startBtn');
            btn.disabled = true;
            btn.innerText = "⏳...";
            camera = new Camera(video, {
                onFrame: async () => {
                    await hands.send({image: video});
                },
                width: 500,
                height: 500,
                facingMode: 'user'
            });
            camera.start().then(() => {
                btn.innerText = "✅ Ready";
                btn.style.background = "#2ecc71";
                btn.disabled = false;
            }).catch(err => {
                console.error("Camera error:", err);
                btn.innerText = "📷 Κάμερα";
                btn.style.background = "";
                btn.disabled = false;
                alert("Σφάλμα κάμερας: " + err);
            });
        }

        function analyzeHand() {
            const age = parseInt(document.getElementById('user-age').value) || 30;
            const zodiac = document.getElementById('zodiac').value;
            const gender = userGender;
            const hand = detectedHand || 'right';
            
            const isLeftHanded = (hand === 'left');
            const dominantHand = isLeftHanded ? 'Αριστερό' : 'Δεξί';
            const nonDominant = isLeftHanded ? 'Δεξί' : 'Αριστερό';

            // --- 1. ΚΥΡΙΕΣ ΓΡΑΜΜΕΣ (Modern & Sivartha Charts) ---
            const lifeLineTypes = [
                { type: "Μακριά & Βαθιά", desc: "Ισχυρή ζωτικότητα, εξαιρετική φυσική κατάσταση, σταθερά επίπεδα ενέργειας και ψυχοσυναισθηματική ισορροπία." },
                { type: "Κοντή & Βαθιά", desc: "Μεγάλη ικανότητα διεξόδου από ψυχικές και σωματικές αντιξοότητες. Τάση να επηρεάζεσαι εύκολα από το περιβάλλον σου." },
                { type: "Αχνή / Αδύναμη", desc: "Χαμηλότερα επίπεδα ενέργειας, ανάγκη για ξεκούραση και αποφυγή περιττών ρίσκων ή ακραίων αλλαγών στη ζωή." },
                { type: "Διακεκομμένη", desc: "Σημαντικές, απρόσμενες αλλαγές πορείας ή εσωτερικοί αγώνες. Γρήγορη ανάκαμψη και υπέρβαση των εμποδίων." },
                { type: "Αλυσιδωτή", desc: "Η πορεία της ζωής σου περνάει από πολλές διαφορετικές κατευθύνσεις και συναισθηματικές μεταβολές." },
                { type: "Διχαλωτή", desc: "Έντονη κοινωνική αναγνώριση, πολλά ταξίδια, πιθανότητα για ριζική αλλαγή περιβάλλοντος ή μετακόμιση στο εξωτερικό." }
            ];
            const lifeLine = lifeLineTypes[Math.floor(Math.random() * lifeLineTypes.length)];

            const heartLineTypes = [
                { type: "Μακριά & Καμπύλη", desc: "Ζεστή και δοτική φύση. Εξιδανικεύεις τις σχέσεις και δείχνεις βαθιά ενσυναίσθηση στους γύρω σου." },
                { type: "Κοντή & Ίσια", desc: "Κλειστός συναισθηματικός κόσμος, επιλεκτική εμπιστοσύνη, έντονος ρεαλισμός και προστασία των συναισθημάτων σου." },
                { type: "Βαθιά", desc: "Έντονα συναισθήματα, μόνιμο ενδιαφέρον για την πορεία των σχέσεων, αλλά και τάση για εσωτερική ανησυχία." },
                { type: "Κυματώδης", desc: "Πολλές κοινωνικές επαφές και ερωτικές εμπειρίες, δυσκολία ή διστακτικότητα για μακροχρόνια δέσμευση." },
                { type: "Τοξωτή", desc: "Διαισθητικό άτομο με εκφραστική δύναμη. Εξωτερικεύεις με μεγάλη ευκολία την αγάπη και τα συναισθήματά σου." }
            ];
            const heartLine = heartLineTypes[Math.floor(Math.random() * heartLineTypes.length)];

            const headLineTypes = [
                { type: "Μακριά", desc: "Υψηλή πνευματική διαύγεια, εξαιρετική μνήμη και ικανότητα διατήρησης της ψυχραιμίας σε κρίσιμες καταστάσεις." },
                { type: "Ίσια / Οριζόντια", desc: "Προσγειωμένη και ρεαλιστική σκέψη. Δίνεις τεράστια βάση στη λεπτομέρεια, τη λογική και την οργάνωση." },
                { type: "Κυματώδης", desc: "Διαρκής εσωτερική μάχη ανάμεσα στη λογική και το συναίσθημα. Μεταβολές στον τρόπο προσέγγισης προβλημάτων." },
                { type: "Αχνή / Διακοπτόμενη", desc: "Τάση για διάσπαση προσοχής, έντονη φαντασία που σε παρασύρει μακριά από την καθημερινή ρουτίνα." },
                { type: "Αλυσιδωτή", desc: "Ανάγκη για καθοδήγηση και επιβεβαίωση πριν από τη λήψη μεγάλων αποφάσεων. Επιφυλακτικότητα." }
            ];
            const headLine = headLineTypes[Math.floor(Math.random() * headLineTypes.length)];

            // --- 2. ΔΕΥΤΕΡΕΥΟΥΣΕΣ ΓΡΑΜΜΕΣ & ΕΡΜΗΤΙΚΑ ΣΗΜΑΔΙΑ (French & Medieval Charts) ---
            const sunLine = Math.random() > 0.5 ? "Εμφανής (Γραμμή Απόλλωνα: Καλλιτεχνική κλίση, φήμη και αναγνώριση)" : "Αμυδρή (Ήσυχη, σταθερή ζωή χωρίς ανάγκη προβολής)";
            const intuitionLine = Math.random() > 0.5 ? "Εμφανής (Δαχτυλίδι Σολομώντα: Έντονη διορατικότητα, σοφία και πνευματικές ικανότητες)" : "Αμυδρή ή ανύπαρκτη";
            const marriageLine = Math.random() > 0.5 ? "Καθαρή (Σημαντικοί και βαθιοί συναισθηματικοί δεσμοί στη ζωή)" : "Πολλαπλές λεπτές γραμμές (Έμφαση στην προσωπική ανεξαρτησία)";

            // --- 3. ΤΥΠΟΙ ΧΕΡΙΩΝ & ΑΣΤΡΟΛΟΓΙΚΟΙ ΟΡΟΙ ---
            const handTypes = [
                "Πρακτικό / Γήινο (Πλατύ, τετράγωνο με κοντά δάχτυλα — Σταθερότητα)",
                "Ιδεαλιστικό / Πνευματικό (Μακρύ, λεπτό με οξύληκτα δάχτυλα — Διαίσθηση)",
                "Ενεργητικό / Πύρινο (Έντονη παλάμη, μακριά δάχτυλα — Φιλοδοξία & Δράση)",
                "Μικτό (Συνδυασμός χαρακτηριστικών — Ευελιξία και προσαρμοστικότητα)"
            ];
            const handType = handTypes[Math.floor(Math.random() * handTypes.length)];

            const signs = [];
            if (Math.random() > 0.5) signs.push("Μυστικιστικός Σταυρός (Mystic Cross) ανάμεσα σε Καρδιά και Κεφάλι: Έφεση στον αποκρυφισμό.");
            if (Math.random() > 0.6) signs.push("Ζώνη της Αφροδίτης (Girdle of Venus): Ιδιαίτερη συναισθηματική ευαισθησία.");
            if (Math.random() > 0.7) signs.push("Γραμμές Βραχιολιών (Bracelets): Ένδειξη μακροζωίας με βάση την ηλικιακή χαρτογράφηση.");
            if (signs.length === 0) signs.push("Κλασικά γραμμικά μοτίβα χωρίς ξένα σώματα.");

            // --- 4. ΠΑΡΑΔΟΣΙΑΚΗ ΚΙΝΕΖΙΚΗ ΙΑΤΡΙΚΗ & ΜΕΣΗΜΒΡΙΝΟΙ (Reflexology Map) ---
            const reflexologyData = [
                { focus: "Μεσημβρινός Πνεύμονα & Παχέος Εντέρου", desc: "Εντοπίζεται στον Αντίχειρα και τον Δείκτη. Δείχνει καλή διαχείριση της ζωτικής ενέργειας (Qi)." },
                { focus: "Μεσημβρινός Περικαρδίου & Καρδιάς", desc: "Στον Μεσαίο και το Μικρό δάχτυλο. Συνδέεται άμεσα με την κυκλοφορία του αίματος και την πνευματική ηρεμία." },
                { focus: "Ζώνη Πεπτικού Συστήματος (Κέντρο Παλάμης)", desc: "Αντανακλά τη λειτουργία του στομάχου και του ήπατος. Η καθαρότητα της περιοχής δείχνει σωματική αντοχή." }
            ];
            const reflexology = reflexologyData[Math.floor(Math.random() * reflexologyData.length)];

            // --- 5. ΦΥΛΟ & ΚΥΡΙΑΡΧΟ ΧΕΡΙ ---
            let genderAnalysis = "";
            if (gender === 'male') {
                genderAnalysis = `
                    <strong>👤 Ανάλυση Φύλου (Άντρας):</strong><br>
                    • Η γραμμή Ζωής παρουσιάζει έντονο βάθος, δείχνοντας σωματική ανθεκτικότητα.<br>
                    • Η γραμμή Κεφαλής εστιάζει στη λογική, την ανάλυση και τη στρατηγική λήψη αποφάσεων.<br>
                    • Οι Αστρολογικοί Όροι του Άρη και του Κρόνου είναι πιο ανεπτυγμένοι, ενισχύοντας την πειθαρχία.
                `;
            } else {
                genderAnalysis = `
                    <strong>👤 Ανάλυση Φύλου (Γυναίκα):</strong><br>
                    • Η γραμμή Καρδιάς είναι εξαιρετικά εκφραστική και καμπύλη, δείχνοντας πλούσιο συναισθηματικό υπόβαθρο.<br>
                    • Η γραμμή Κεφαλής συνδυάζει τη λογική με τη διαίσθηση.<br>
                    • Οι Όροι της Αφροδίτης και της Σελήνης είναι έντονοι, προσφέροντας δημιουργικότητα και ενσυναίσθηση.
                `;
            }

            const dominantAnalysis = `
                <strong>🖐️ Δυναμική Χεριών:</strong><br>

                "Τοξότης": "Συνδέεται με τον Όρο του Δία. Φιλοσοφημένη στάση ζωής, αγάπη για τα ταξίδια και την ελευθερία.",
                "Αιγόκερως": "Συνδέεται με τον Όρο του Κρόνου. Φιλοδοξία, υπομονή, εργατικότητα και σοβαρότητα.",
                "Υδροχόος": "Συνδέεται με τον Όρο του Κρόνου/Ουρανού. Πρωτοποριακή σκέψη, ανεξαρτησία και αντισυμβατικότητα.",
                "Ιχθείς": "Συνδέεται με τον Όρο της Σελήνης. Έντονος ιδεαλισμός, ρομαντισμός και πνευματικές αναζητήσεις."
            };
            const zodiacMatch = zodiacMap[zodiac] || "Συνδυασμός με το ζώδιο σου.";

            return {
                type: 'hand',
                lifeLine: lifeLine,
                heartLine: heartLine,
                headLine: headLine,
                sunLine: sunLine,
                intuitionLine: intuitionLine,
                marriageLine: marriageLine,
                handType: handType,
                signs: signs,
                reflexology: reflexology,
                genderAnalysis: genderAnalysis,

                ageAnalysis: ageAnalysis,
                zodiac: zodiac,
                zodiacMatch: zodiacMatch,
                userAge: age,
                dominantHand: dominantHand,
                gender: gender === 'male' ? 'Άντρας' : 'Γυναίκα',
                stats: {
                    "Γραμμή Ζωής": lifeLine.type,
                    "Γραμμή Καρδιάς": heartLine.type,
                    "Γραμμή Νου": headLine.type,

                source: uploadedImage ? 'upload' : 'camera'

        }

        function performAnalysis() {
            const result = analyzeHand();
            displayResult(result);
            analysisResult = result;
        }

        function displayResult(r) {

            elementDisplay.innerHTML = `<strong>✋ Πλήρης Εσωτερική Ανάλυση Παλάμης</strong> (${r.gender})`;

            ageDisplay.innerHTML = `📅 ${r.ageAnalysis}`;

                <hr style="border-color:#444;">

                <hr style="border-color:#444;">
                ${r.dominantAnalysis}<br>
                <hr style="border-color:#444;">
                <strong>♈ Αστρολογική Σύνδεση (${r.zodiac}):</strong> ${r.zodiacMatch}
            `;
            
            grid.innerHTML = `
                <div class="stat-item"><span class="badge">Γραμμή Ζωής</span><br>${r.lifeLine.type}</div>
                <div class="stat-item"><span class="badge">Γραμμή Καρδιάς</span><br>${r.heartLine.type}</div>
                <div class="stat-item"><span class="badge">Γραμμή Νου</span><br>${r.headLine.type}</div>
                <div class="stat-item"><span class="badge">Μορφολογία</span><br>${r.handType.split(' ')[0]}</div>
                <div class="stat-item"><span class="badge">Ρεφλεξολογία</span><br>Ενεργό Qi</div>
                <div class="stat-item"><span class="badge">Ζώδιο</span><br>${r.zodiac}</div>
                <div class="stat-item"><span class="badge">Σημάδια</span><br>Εντοπίστηκαν</div>
                <div class="stat-item"><span class="badge">Κυρίαρχο Χέρι</span><br>${r.dominantHand}</div>

        }

        function callMonetagAd() {
            return new Promise((resolve, reject) => {
                if (typeof show_10979429 === 'function') {
                    show_10979429().then(resolve).catch(reject);
                } else {
                    setTimeout(() => {
                        if (typeof show_10979429 === 'function') {
                            show_10979429().then(resolve).catch(reject);
                        } else {
                            resolve();
                        }
                    }, 500);
                }
            });
        }

        function refreshWithAd() {
            callMonetagAd().then(() => {
                resetAll();
            }).catch(() => {
                resetAll();
            });
        }

        function resetAll() {
            document.getElementById('result-area').style.display = 'none';
            document.getElementById('loading').style.display = 'none';
            document.getElementById('startBtn').disabled = false;
            document.getElementById('startBtn').innerText = "📷 Κάμερα";
            ctx.clearRect(0,0,overlay.width,overlay.height);
            landmarksData = null;
            analysisResult = null;
            analysisDone = false;
            document.getElementById('upload-preview').style.display = 'none';
            document.getElementById('auto-status').style.display = 'none';
            document.getElementById('upload-type').innerText = '';
            uploadedImage = null;
        }

        function saveToHistory() {
            if (!analysisResult) { alert("Κάνε ανάλυση πρώτα!"); return; }
            let h = JSON.parse(localStorage.getItem('history') || '[]');
            h.push({
                id: Date.now(),
                ...analysisResult,
                dateStr: new Date().toLocaleString('el-GR')
            });
            localStorage.setItem('history', JSON.stringify(h));
            renderHistory();
            alert("✅ Η ανάλυση αποθηκεύτηκε επιτυχώς στο ιστορικό!");
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            const h = JSON.parse(localStorage.getItem('history') || '[]');
            if (!h.length) {
                list.innerHTML = "<p style='color:#888;'>Δεν υπάρχουν αποθηκευμένες αναλύσεις.</p>";
                return;
            }
            list.innerHTML = h.map((item, i) => `
                <div class="history-item">
                    <strong>#${i+1}</strong> <small>${item.dateStr}</small> (${item.source === 'upload' ? '📁 Φωτογραφία' : '📷 Κάμερα'})<br>
                    ✋ Ζωή: ${item.lifeLine.type} | Καρδιά: ${item.heartLine.type} | ♈ ${item.zodiac} | 📅 ${item.userAge} ετών
                    <div class="history-actions">
                        <button onclick="deleteHistoryItem(${i})" style="background:#e74c3c;color:#fff;">Διαγραφή</button>
                        <button onclick="exportHistoryItemAsPDF(${i})" style="background:#3498db;color:#fff;">PDF</button>
                    </div>
                </div>
            `).join('');
            document.getElementById('history-area').style.display = 'block';
        }

        function deleteHistoryItem(i) {
            let h = JSON.parse(localStorage.getItem('history') || '[]');
            h.splice(i, 1);
            localStorage.setItem('history', JSON.stringify(h));
            renderHistory();
        }

        function clearHistory() {
            if (confirm("Θέλετε σίγουρα να διαγράψετε όλο το ιστορικό αναλύσεων;")) {
                localStorage.removeItem('history');
                renderHistory();
                alert("Το ιστορικό εκκαθαρίστηκε.");
            }
        }

        async function exportHistoryItemAsPDF(i) {
            const h = JSON.parse(localStorage.getItem('history') || '[]');
            const item = h[i];
            if (!item) return;
            generatePDFFile(item, item.dateStr);
        }

        async function exportPDF() {
            if (!analysisResult) { alert("Κάνε ανάλυση πρώτα!"); return; }
            const now = new Date();
            generatePDFFile(analysisResult, now.toLocaleDateString('el-GR'));
        }

        async function generatePDFFile(data, dateLabel) {
            const content = document.createElement('div');
            content.innerHTML = `
                <div style="font-family:Arial, sans-serif; padding:30px; color:#111; background:white; max-width:600px; margin:auto; border: 2px solid #B8860B; border-radius:15px;">
                    <h2 style="text-align:center; color:#B8860B; margin-bottom:5px;">🧿 HandMaster Pro</h2>
                    <p style="text-align:center; color:#666; font-size:12px; margin-top:0;">Προηγμένη Αναφορά Χειρομαντείας AI</p>
                    <p style="text-align:right; color:#444; font-size:12px;"><strong>Ημερομηνία:</strong> ${dateLabel}</p>
                    <hr style="border-color:#B8860B;">
                    <p><strong>👤 Προφίλ:</strong> ${data.gender} | ${data.userAge} ετών | Ζώδιο: ${data.zodiac}</p>
                    <p><strong>🖐️ Κυρίαρχο Χέρι:</strong> ${data.dominantHand}</p>
                    <p><strong>📐 Μορφολογία Παλάμης:</strong> ${data.handType}</p>
                    <hr style="border-color:#eee;">
                    <p><strong>🧬 Γραμμή Ζωής:</strong> ${data.lifeLine.type} — ${data.lifeLine.desc}</p>
                    <p><strong>❤️ Γραμμή Καρδιάς:</strong> ${data.heartLine.type} — ${data.heartLine.desc}</p>
                    <p><strong>🧠 Γραμμή Νου:</strong> ${data.headLine.type} — ${data.headLine.desc}</p>
                    <p><strong>☀️ Γραμμή Απόλλωνα (Ήλιου):</strong> ${data.sunLine}</p>
                    <p><strong>🌿 Ρεφλεξολογία (Κινεζική Ιατρική):</strong> ${data.reflexology.focus} — ${data.reflexology.desc}</p>
                    <p><strong>🔖 Ειδικά Σημάδια:</strong> ${data.signs.join(' ')}</p>
                    <hr style="border-color:#B8860B;">
                    <p style="text-align:center; font-size:11px; color:#999; font-style:italic;">Ευχαριστούμε που χρησιμοποιήσατε το HandMaster Pro AI</p>
                </div>
            `;
            document.body.appendChild(content); // Προσωρινή προσθήκη για σωστό rendering
            const { jsPDF } = window.jspdf;
            const canvas = await html2canvas(content, { scale:2, backgroundColor:'#ffffff' });
            document.body.removeChild(content);
            
            const pdf = new jsPDF('p','mm','a4');
            const w = pdf.internal.pageSize.getWidth();
            pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, w, (canvas.height * w) / canvas.width);
            pdf.save(`HandMaster_Report_${dateLabel.replace(/\//g, '-')}.pdf`);
        }

        function drawConnectors(ctx, lm, conn, style) {
            ctx.strokeStyle = style.color;
            ctx.lineWidth = style.lineWidth;
            for (const [i,j] of conn) {
                ctx.beginPath();
                ctx.moveTo(lm[i].x * overlay.width, lm[i].y * overlay.height);
                ctx.lineTo(lm[j].x * overlay.width, lm[j].y * overlay.height);
                ctx.stroke();
            }
        }
        function drawLandmarks(ctx, lm, style) {
            ctx.fillStyle = style.color;
            for (const p of lm) {
                ctx.beginPath();
                ctx.arc(p.x * overlay.width, p.y * overlay.height, style.radius, 0, 2*Math.PI);
                ctx.fill();
            }
        }
        const HAND_CONNECTIONS = [
            [0,1],[1,2],[2,3],[3,4],
            [0,5],[5,6],[6,7],[7,8],
            [0,9],[9,10],[10,11],[11,12],
            [0,13],[13,14],[14,15],[15,16],
            [0,17],[17,18],[18,19],[19,20],
            [5,9],[9,13],[13,17]
        ];

        window.onload = function() {
            const h = JSON.parse(localStorage.getItem('history') || '[]');
            if (h.length) {
                renderHistory();
                document.getElementById('history-area').style.display = 'block';
            }
        };
    </script>
